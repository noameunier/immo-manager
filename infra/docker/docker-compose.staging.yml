name: immo-staging

# Préproduction sur le VPS.
# Tous les ports sont liés à 127.0.0.1 : Caddy assure l'exposition publique.
# Ne jamais remplacer 127.0.0.1 par 0.0.0.0.
services:
  db:
    image: postgres:17-alpine
    container_name: immo-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: ${IMMO_STAGING_DB_PASSWORD:?définir IMMO_STAGING_DB_PASSWORD}
      POSTGRES_DB: immo_staging
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - immo_staging_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immo -d immo_staging']
      interval: 10s
      timeout: 5s
      retries: 20
    # Limite les dégâts en cas de requête pathologique.
    shm_size: 256mb

volumes:
  immo_staging_db:
