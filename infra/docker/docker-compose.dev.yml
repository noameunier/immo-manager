name: immo-dev

# Environnement de développement local uniquement.
# Tous les ports sont liés à 127.0.0.1 : aucun service n'est exposé publiquement.
services:
  db:
    image: postgres:17-alpine
    container_name: immo-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: immo
      POSTGRES_PASSWORD: ${IMMO_DEV_DB_PASSWORD:-immo_dev_only}
      POSTGRES_DB: immo_dev
      # Collation déterministe pour les tris et comparaisons d'emails
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - immo_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immo -d immo_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: immo-dev-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

volumes:
  immo_dev_db:
