name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.15.0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, tests et builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo_ci_only
          POSTGRES_DB: immo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo -d immo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_test?schema=public
      TEST_DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_test?schema=public
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le paquet partagé
        run: pnpm --filter @immo/shared build

      - name: Lint
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests d'intégration API
        run: pnpm --filter @immo/api test

      - name: Build API et web
        run: |
          pnpm --filter @immo/api build
          pnpm --filter @immo/web build

      - name: Build mobile (bundle Android)
        run: pnpm --filter @immo/mobile build

  e2e:
    name: Parcours navigateur Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo_ci_only
          POSTGRES_DB: immo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo -d immo_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_dev?schema=public
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: development
      API_PORT: '4100'
      API_HOST: '127.0.0.1'
      WEB_ORIGIN: http://localhost:3100
      REQUIRE_EMAIL_VERIFICATION: 'false'
      MAIL_TRANSPORT: mailpit
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le paquet partagé
        run: pnpm --filter @immo/shared build

      - name: Appliquer les migrations
        run: pnpm --filter @immo/api exec prisma migrate deploy

      - name: Construire l'API et le web
        run: |
          pnpm --filter @immo/api build
          pnpm --filter @immo/web build

      - name: Installer Chromium
        run: pnpm --filter @immo/web exec playwright install --with-deps chromium

      - name: Lancer le parcours Playwright
        run: pnpm --filter @immo/web test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
