name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.15.0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, tests et builds
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo_ci_only
          POSTGRES_DB: immo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo -d immo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Les tests d'intégration vérifient la réception réelle des emails
      # (vérification d'adresse, réinitialisation) en interrogeant l'API HTTP de
      # Mailpit. Sans ce service, ces tests échouent faute de transporteur.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1026:1025
          - 8026:8025

    env:
      DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_test?schema=public
      TEST_DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_test?schema=public
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le paquet partagé
        run: pnpm --filter @immo/shared build

      - name: Lint
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests d'intégration API
        run: |
          set -o pipefail
          pnpm --filter @immo/api test 2>&1 | tee "${RUNNER_TEMP}/api-tests.log"

      # Les annotations d'un job sont lisibles publiquement via l'API GitHub,
      # contrairement aux journaux qui exigent une authentification. On publie
      # donc les lignes d'échec essentielles en annotations.
      - name: Publier le diagnostic des tests
        if: failure()
        run: |
          log="${RUNNER_TEMP}/api-tests.log"
          [ -f "$log" ] || exit 0
          {
            grep -E "FAIL |AssertionError|EADDRINUSE|ECONNREFUSED|ENOENT|P1001|Command failed|Tests +[0-9]" "$log" || true
            awk '/Échec de la préparation/{flag=1} flag{print; n++} n>=4{exit}' "$log"
          } | tail -30 > "${RUNNER_TEMP}/diag.txt"
          if [ ! -s "${RUNNER_TEMP}/diag.txt" ]; then
            tail -15 "$log" > "${RUNNER_TEMP}/diag.txt"
          fi
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/}"
            echo "::error::${line}"
          done < "${RUNNER_TEMP}/diag.txt"

      - name: Build API et web
        # Un NODE_ENV hérité (test, development) fausse le build Next.js :
        # le build doit toujours être produit en mode production.
        env:
          NODE_ENV: production
        run: |
          pnpm --filter @immo/api build
          pnpm --filter @immo/web build

      - name: Build mobile (bundle Android)
        run: pnpm --filter @immo/mobile build

  e2e:
    name: Parcours navigateur Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: immo_ci_only
          POSTGRES_DB: immo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immo -d immo_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://immo:immo_ci_only@127.0.0.1:5432/immo_dev?schema=public
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      # NODE_ENV n'est volontairement pas défini ici : le build exige
      # production, l'API du parcours exige développement (cookie non Secure).
      # Chaque étape (et chaque serveur Playwright) fixe la valeur adéquate.
      API_PORT: '4100'
      API_HOST: '127.0.0.1'
      WEB_ORIGIN: http://localhost:3100
      REQUIRE_EMAIL_VERIFICATION: 'false'
      MAIL_TRANSPORT: mailpit
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire le paquet partagé
        run: pnpm --filter @immo/shared build

      - name: Appliquer les migrations
        run: pnpm --filter @immo/api exec prisma migrate deploy

      - name: Construire l'API et le web
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm --filter @immo/api build 2>&1 | tee "${RUNNER_TEMP}/build-api.log"
          pnpm --filter @immo/web build 2>&1 | tee "${RUNNER_TEMP}/build-web.log"

      - name: Installer Chromium
        run: pnpm --filter @immo/web exec playwright install --with-deps chromium

      - name: Lancer le parcours Playwright
        run: |
          set -o pipefail
          pnpm --filter @immo/web test:e2e 2>&1 | tee "${RUNNER_TEMP}/e2e.log"

      # Comme pour les tests API : les annotations sont lisibles publiquement.
      - name: Publier le diagnostic du parcours
        if: failure()
        run: |
          {
            for f in "${RUNNER_TEMP}"/build-api.log "${RUNNER_TEMP}"/build-web.log "${RUNNER_TEMP}"/e2e.log; do
              [ -f "$f" ] || continue
              echo "--- $(basename "$f") ---"
              grep -E "Error|error|⨯|✘|Timed out|failed|TypeError|Cannot" "$f" | tail -12 || true
              tail -5 "$f"
            done
          } | tail -40 > "${RUNNER_TEMP}/diag-e2e.txt"
          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/}"
            echo "::error::${line}"
          done < "${RUNNER_TEMP}/diag-e2e.txt"

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
